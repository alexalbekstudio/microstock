<!doctype html>
<html lang="{{ current_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t("reset_password") }} — MicroStock</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-icon.png') }}">
</head>
<body class="login-body">
  <div class="login-box">

    <div class="login-brand">
      <img src="{{ url_for('static', filename='img/logo-icon.png') }}"
           alt="ALEXANDAR" class="login-brand__icon">
      <img src="{{ url_for('static', filename='img/logo-wordmark.png') }}"
           alt="ALEXANDAR" class="login-brand__wordmark">
    </div>

    <div class="login-sep"></div>

    <h1 class="login-title">🔐 {{ t("reset_password") }}</h1>

    <div class="login-sep"></div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="flash-{{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="login-form">
      <label class="login-label">{{ t("new_password") }}
        <input name="password" type="password" required autofocus
               minlength="6" placeholder="{{ t('password_min_6') }}">
      </label>
      <label class="login-label">{{ t("new_password_confirm") }}
        <input name="password2" type="password" required
               minlength="6" placeholder="{{ t('password_min_6') }}">
      </label>
      <button type="submit" class="login-submit">{{ t("reset_password_button") }}</button>
    </form>

    <div class="login-sep"></div>

    <p class="login-hint" style="margin-top:1rem">
      <a href="{{ url_for('auth.login') }}">← {{ t("back_to_login") }}</a>
    </p>

  </div>

  <footer class="login-footer">
    <a href="mailto:alexalbekstudio.design@gmail.com">
      alexalbekstudio.design@gmail.com
    </a>
    <div>© 2026 ALEXANDAR Studio. {{ t("all_rights_reserved") }}</div>
  </footer>
</body>
</html>
