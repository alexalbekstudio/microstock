{% extends "base.html" %}
{% block title %}{{ t("edit_product") }} — MicroStock{% endblock %}
{% block topbar_title %}📦 {{ t("edit_product") }}{% endblock %}
{% block content %}
<div class="page-header__actions">
  <a href="{{ url_for('product_qr_png', pid=p.id) }}"
     class="btn btn--secondary" download>📱 {{ t("qr_code") }}</a>
</div>
<div class="page-header">
  <h1>✏️ {{ t("edit_product") }}</h1>
  <a href="/products" class="btn btn--secondary">← {{ t("back") }}</a>
</div>

<form method="post">
  <div class="card">
    <div class="grid-form" style="box-shadow:none; padding:0; background:transparent; border:none;">
      <div class="form-row">
        <label>{{ t("sku") }}</label>
        <input name="sku" value="{{ p.sku }}" required>
      </div>
      <div class="form-row">
        <label>{{ t("product_name") }}</label>
        <input name="name" value="{{ p.name }}" required>
      </div>
      <div class="form-row">
        <label>{{ t("price") }}</label>
        <input name="price" type="number" step="0.01" value="{{ p.price }}" required>
      </div>
      <div class="form-row">
        <label>{{ t("cost") }}</label>
        <input name="cost" type="number" step="0.01" value="{{ p.cost or 0 }}">
      </div>
      <div class="form-row">
        <label>{{ t("stock") }}</label>
        <input name="stock" type="number" value="{{ p.stock }}" required>
      </div>
      <div class="form-row">
        <label>{{ t("low_stock_at") }}</label>
        <input name="low_stock_at" type="number" value="{{ p.low_stock_at or 3 }}">
      </div>
    </div>
    <div class="btn-row">
      <button type="submit" class="btn btn--primary">💾 {{ t("save") }}</button>
      <a href="/products" class="btn btn--secondary">{{ t("cancel") }}</a>
    </div>
  </div>
</form>

{% endblock %}
